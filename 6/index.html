  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

om:1px solid rgba(41,36,31,.14);box-shadow:0 50px 60px -40px rgba(41,36,31,.3)\">\n      <div style=\"max-width:1680px;margin:0 auto;padding:32px clamp(24px,5vw,96px) 44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 48px\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <a href=\"#services\" sc-camel-on-click=\"{{ closeMega }}\" style=\"display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid rgba(41,36,31,.12);font:400 23px/1.2 'Cormorant'\" style-hover=\"color:#8a6f4e\">\n            <i class=\"ic {{ s.icon }}\" style=\"font-size:22px;color:#8a6f4e;flex:none\"><\u002Fi>{{ s.title }}\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<header data-screen-label=\"01 Hero\" style=\"display:flex;flex-wrap:wrap;min-height:max(640px, calc(100vh - 90px));padding-left:max(clamp(24px,5vw,96px), calc((100vw - 1680px) / 2 + 96px))\">\n  <div style=\"flex:1 1 460px;display:flex;flex-direction:column;justify-content:space-between;gap:56px;padding:clamp(40px,7vh,88px) clamp(24px,4vw,80px) clamp(28px,5vh,52px) 0\">\n    <span data-reveal=\"up\" style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Індивідуальна адвокатська практика<\u002Fspan>\n    <div style=\"display:flex;flex-direction:column;gap:30px\">\n      <h1 data-reveal=\"up\" data-delay=\"120\" style=\"margin:0;font:300 clamp(42px,4.3vw,76px)/1.04 'Cormorant';letter-spacing:-.015em;text-wrap:balance;max-width:680px\">Адвокат Мазур — <em style=\"font-style:italic\">захист прав<\u002Fem> фізичних осіб і бізнесу<\u002Fh1>\n      <p data-reveal=\"up\" data-delay=\"240\" style=\"margin:0;font-size:15px;line-height:1.75;font-weight:300;color:#6a6158;max-width:420px;text-wrap:pretty\">У кримінальних, адміністративних і транспортних справах — особисто, від першої консультації до рішення суду.<\u002Fp>\n      <div data-reveal=\"up\" data-delay=\"360\" style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:14px;padding:20px 32px;background:#29241f;color:#f3efe9;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:background .4s\" style-hover=\"background:#4a4038;color:#f3efe9\">Отримати консультацію <i class=\"ic ic-arrow-right\" style=\"font-size:14px\"><\u002Fi><\u002Fa>\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"display:inline-flex;align-items:center;padding:19px 31px;border:1px solid #29241f;background:transparent;color:#29241f;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .4s,color .4s\" style-hover=\"background:#29241f;color:#f3efe9\">Передзвоніть мені<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"up\" data-delay=\"480\" style=\"display:flex;flex-wrap:wrap;gap:10px 40px;padding-top:22px;border-top:1px solid rgba(41,36,31,.16);font:400 10.5px/1.4 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;color:#6a6158\">\n      <span>Свідоцтво № 0000<\u002Fspan><span>Член НААУ<\u002Fspan><span>Київ · вся Україна<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"zoom\" style=\"flex:1.35 1 560px;min-height:620px;position:relative;overflow:hidden\">\n    <img src=\"aab13a02-5be7-4ca2-8a9e-c91033e08d4d\" alt=\"Адвокат Мазур\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block\">\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<section id=\"about\" data-screen-label=\"02 Про адвоката\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,9vw,150px) clamp(24px,5vw,96px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:28px clamp(40px,6vw,120px);align-items:flex-end;justify-content:space-between;margin-bottom:clamp(44px,5vw,72px)\">\n    <div data-reveal=\"up\" style=\"flex:1.6 1 560px;display:flex;flex-direction:column;gap:22px\">\n      <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Про адвоката<\u002Fspan>\n      <h2 style=\"margin:0;font:300 clamp(36px,3.6vw,64px)/1.08 'Cormorant';letter-spacing:-.015em;text-wrap:balance;max-width:1000px\">Я захищаю людей і бізнес там, де помилка коштує <em style=\"font-style:italic\">свободи<\u002Fem>, ліцензії або <em style=\"font-style:italic\">репутації<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p data-reveal=\"up\" data-delay=\"120\" style=\"flex:1 1 320px;max-width:420px;margin:0;font-size:15px;line-height:1.75;font-weight:300;color:#6a6158\">Індивідуальна практика без посередників: кожну справу веду особисто і відповідаю за результат — від аналізу документів до виступу в суді.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"overflow:hidden;border-top:1px solid rgba(41,36,31,.16);border-bottom:1px solid rgba(41,36,31,.16)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-left:-1px\">\n      <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n        <div style=\"padding:38px 32px 34px;border-left:1px solid rgba(41,36,31,.16)\">\n          <div data-reveal=\"up\" data-delay=\"{{ st.delay }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font:300 clamp(54px,4.8vw,88px)/1 'Cormorant';letter-spacing:-.02em\">{{ st.num }}<em style=\"font-style:italic;color:#8a6f4e\">{{ st.suf }}<\u002Fem><\u002Fspan>\n            <span style=\"font:400 10.5px/1.5 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;color:#6a6158\">{{ st.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" data-screen-label=\"03 Послуги\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,9vw,150px) clamp(24px,5vw,96px) clamp(40px,5vw,80px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px 64px;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(40px,5vw,72px)\">\n    <div data-reveal=\"up\" style=\"display:flex;flex-direction:column;gap:22px\">\n      <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Послуги<\u002Fspan>\n      <h2 style=\"margin:0;font:300 clamp(42px,4.4vw,80px)/1 'Cormorant';letter-spacing:-.015em\">Надаю <em style=\"font-style:italic\">послуги<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <p data-reveal=\"up\" data-delay=\"120\" style=\"margin:0;max-width:380px;font-size:14.5px;line-height:1.75;font-weight:300;color:#6a6158\">Вісім напрямів практики — від кримінального захисту до документів для перевізників.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:rgba(41,36,31,.16);border:1px solid rgba(41,36,31,.16)\">\n    <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <a href=\"#contact\" style=\"display:flex;background:#f3efe9;min-height:400px;transition:background .6s\" style-hover=\"background:#ebe5dc;color:#29241f\">\n        <div data-reveal=\"up\" data-delay=\"{{ s.delay }}\" style=\"flex:1;display:flex;flex-direction:column;gap:22px;padding:36px 32px 32px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n            <i class=\"ic {{ s.icon }}\" style=\"font-size:36px;color:#8a6f4e\"><\u002Fi>\n            <span style=\"font:italic 300 22px/1 'Cormorant';color:#6a6158\">{{ s.n }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font:400 10px/1.4 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;color:#8a6f4e\">{{ s.label }}<\u002Fspan>\n            <h3 style=\"margin:0;font:400 29px/1.08 'Cormorant';text-wrap:balance\">{{ s.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ s.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <li style=\"display:flex;gap:14px;font-size:13.5px;line-height:1.5;font-weight:300;color:#6a6158\"><i class=\"ic ic-li-dash\" style=\"font-size:16px;color:#8a6f4e;margin-top:2px\"><\u002Fi>{{ it }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <span style=\"margin-top:auto;display:flex;align-items:center;gap:10px;font:400 10.5px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase\">Детальніше <i class=\"ic ic-arrow-right\" style=\"font-size:13px\"><\u002Fi><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 SEO текст 1\" style=\"max-width:1680px;margin:0 auto;padding:clamp(40px,5vw,80px) clamp(24px,5vw,96px) clamp(80px,9vw,140px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px clamp(40px,6vw,120px)\">\n    <h2 data-reveal=\"up\" style=\"flex:1 1 380px;margin:0;font:300 clamp(28px,2.6vw,44px)/1.14 'Cormorant';text-wrap:balance\">Адвокат Мазур: юридичний захист у кримінальних, адміністративних і транспортних справах<\u002Fh2>\n    <article data-reveal=\"up\" data-delay=\"120\" style=\"flex:1.3 1 520px;max-width:820px;display:flex;flex-direction:column;gap:20px\">\n      <p style=\"margin:0;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c;text-wrap:pretty\">Адвокат Мазур надає правову допомогу фізичним особам, підприємцям і перевізникам у справах, де від швидкості та точності дій залежить результат. Кожна справа починається з аналізу документів і обставин: ви отримуєте зрозумілу оцінку ризиків, план дій і фіксовану вартість роботи ще до підписання договору.<\u002Fp>\n      <div style=\"display:grid;grid-template-rows:{{ seo1Rows }};transition:grid-template-rows .7s cubic-bezier(.2,.7,.2,1)\">\n        <div style=\"min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px\">\n          <h3 style=\"margin:6px 0 0;font:400 24px/1.2 'Cormorant'\">Кримінальний захист<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c\">Захист у справах про корупційні, економічні та фінансові злочини; супровід на допитах; оскарження запобіжних заходів і арешту майна; представництво у ВАКС та судах усіх інстанцій.<\u002Fp>\n          <h3 style=\"margin:10px 0 0;font:400 24px/1.2 'Cormorant'\">Транспортне право<\u002Fh3>\n          <p style=\"margin:0 0 6px;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c\">Отримання ліцензій на перевезення пасажирів і вантажів, оформлення чіп-карти водія, Коду 95 та номера EORI для роботи з митницями ЄС. Супровід перевірок і оскарження штрафів.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleSeo1 }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:0 0 7px;border:none;border-bottom:1px solid #29241f;background:transparent;color:#29241f;font:400 10.5px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;cursor:pointer\" style-hover=\"color:#8a6f4e;border-color:#8a6f4e\">{{ seo1Label }} <i class=\"ic ic-plus\" style=\"font-size:12px;transform:rotate({{ seo1Rot }});transition:transform .4s\"><\u002Fi><\u002Fbutton>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"steps\" data-screen-label=\"05 Етапи\" style=\"background:#ebe5dc;padding:clamp(80px,9vw,150px) 0\">\n  <div style=\"max-width:1680px;margin:0 auto;padding:0 clamp(24px,5vw,96px)\">\n    <div data-reveal=\"up\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;margin-bottom:clamp(56px,6vw,100px)\">\n      <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Етапи<\u002Fspan>\n      <h2 style=\"margin:0;font:300 clamp(42px,4.4vw,80px)/1 'Cormorant';letter-spacing:-.015em\">Як проходить <em style=\"font-style:italic\">робота<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(calc((100% - 160px) / 6), calc((1100px - 100%) * 999), calc((100% - 64px) / 3)),1fr));gap:56px 32px\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"6\">\n        <div style=\"position:relative;display:flex;flex-direction:column;gap:22px;padding-top:30px\">\n          <span style=\"position:absolute;left:0;right:0;top:0;height:1px;background:rgba(41,36,31,.16)\"><\u002Fspan>\n          <span data-reveal=\"line\" data-delay=\"{{ st.delay }}\" style=\"position:absolute;left:0;right:0;top:0;height:1px;background:#29241f\"><\u002Fspan>\n          <span style=\"font:italic 300 48px/1 'Cormorant';color:#8a6f4e\">{{ st.n }}<\u002Fspan>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.7;font-weight:300;text-wrap:pretty\">{{ st.text }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div data-reveal=\"up\" style=\"display:flex;justify-content:center;margin-top:clamp(56px,6vw,96px)\">\n      <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:14px;padding:20px 32px;background:#29241f;color:#f3efe9;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:background .4s\" style-hover=\"background:#4a4038;color:#f3efe9\">Отримати консультацію <i class=\"ic ic-arrow-right\" style=\"font-size:14px\"><\u002Fi><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" data-screen-label=\"06 Чому я\" style=\"padding:clamp(80px,9vw,150px) 0\">\n  <div style=\"max-width:1680px;margin:0 auto;padding:0 clamp(24px,5vw,96px);display:flex;flex-wrap:wrap;gap:56px clamp(40px,6vw,120px);align-items:flex-start\">\n    <div style=\"flex:1 1 480px;display:flex;flex-direction:column;gap:14px\">\n      <div data-reveal=\"zoom\" sty {{ r.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-reveal=\"up\" style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:14px;padding:20px 32px;background:#29241f;color:#f3efe9;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:background .4s\" style-hover=\"background:#4a4038;color:#f3efe9\">Записатися на консультацію <i class=\"ic ic-arrow-right\" style=\"font-size:14px\"><\u002Fi><\u002Fa>\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"display:inline-flex;align-items:center;padding:19px 31px;border:1px solid #29241f;background:transparent;color:#29241f;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .4s,color .4s\" style-hover=\"background:#29241f;color:#f3efe9\">Передзвоніть мені<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"07 Заявка\" style=\"background:#29241f;color:#efe9e0;display:flex;flex-wrap:wrap\">\n  <div data-reveal=\"zoom\" style=\"flex:1 1 480px;min-height:clamp(520px,50vw,860px);position:relative;overflow:hidden\">\n    <img src=\"2fc11d99-dd93-4014-9ca6-5db41e1376b1\" alt=\"Консультація адвоката\" loading=\"lazy\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block\">\n  <\u002Fdiv>\n  <div style=\"flex:1.1 1 520px;padding:clamp(56px,7vw,120px) max(clamp(24px,5vw,96px), calc((100vw - 1680px) / 2 + 96px)) clamp(56px,7vw,120px) clamp(32px,6vw,120px);display:flex;flex-direction:column;justify-content:center;gap:22px\">\n    <span data-reveal=\"up\" style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#b5aa9c\">Заявка<\u002Fspan>\n    <h2 data-reveal=\"up\" data-delay=\"100\" style=\"margin:0;font:300 clamp(36px,3.4vw,62px)/1.06 'Cormorant';letter-spacing:-.01em;text-wrap:balance;max-width:720px\">Хочете отримати консультацію та <em style=\"font-style:italic\">оцінку перспектив<\u002Fem> справи?<\u002Fh2>\n    <p data-reveal=\"up\" data-delay=\"200\" style=\"margin:0;font-size:15px;line-height:1.75;font-weight:300;color:#b5aa9c;max-width:460px\">Заповніть форму — я зв'яжуся з вами та запропоную план дій.<\u002Fp>\n    <sc-if value=\"{{ formNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 36px;margin-top:18px;max-width:720px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-bottom:1px solid rgba(239,233,224,.3)\"><span style=\"font:400 10px/1 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#b5aa9c\">Ім'я<\u002Fspan><input required=\"\" placeholder=\"Як до вас звертатися\" style=\"height:50px;border:none;background:transparent;color:#efe9e0;font:300 23px 'Cormorant';outline:none\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-bottom:1px solid rgba(239,233,224,.3)\"><span style=\"font:400 10px/1 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#b5aa9c\">Телефон<\u002Fspan><input type=\"tel\" required=\"\" placeholder=\"+380 __ ___ __ __\" style=\"height:50px;border:none;background:transparent;color:#efe9e0;font:300 23px 'Cormorant';outline:none\"><\u002Flabel>\n        <label style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;padding-top:16px;border-bottom:1px solid rgba(239,233,224,.3)\"><span style=\"font:400 10px/1 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#b5aa9c\">Напрям<\u002Fspan>\n          <sc-raw-select style=\"height:50px;border:none;background:transparent;color:#efe9e0;font:300 23px 'Cormorant';outline:none\">\n            <option>Оберіть напрям<\u002Foption>\n            <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\"><option>{{ s.title }}<\u002Foption><\u002Fsc-for>\n            <option>Інше<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <div style=\"grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:18px 32px;margin-top:30px\">\n          <button type=\"submit\" style=\"display:inline-flex;align-items:center;gap:14px;padding:20px 32px;border:none;background:#efe9e0;color:#29241f;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .4s\" style-hover=\"background:#d8cfc2\">Надіслати заявку <i class=\"ic ic-arrow-right\" style=\"font-size:14px\"><\u002Fi><\u002Fbutton>\n          <span style=\"flex:1 1 220px;font-size:12px;line-height:1.6;font-weight:300;color:#b5aa9c\">Натискаючи кнопку, ви погоджуєтеся на обробку <a href=\"#\" style=\"text-decoration:underline;text-underline-offset:3px\">персональних даних<\u002Fa>.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px;padding:34px 0;border-top:1px solid rgba(239,233,224,.3);border-bottom:1px solid rgba(239,233,224,.3);display:flex;flex-direction:column;gap:12px;max-width:720px\">\n        <span style=\"font:italic 300 48px/1 'Cormorant'\">Дякую.<\u002Fspan>\n        <span style=\"font-size:15px;line-height:1.7;font-weight:300;color:#b5aa9c\">Заявку отримано. Я зв'яжуся з вами найближчим часом.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"reviews\" data-screen-label=\"08 Відгуки\" style=\"padding:clamp(80px,9vw,150px) 0;overflow:hidden\">\n  <div style=\"max-width:1680px;margin:0 auto clamp(40px,5vw,72px);padding:0 clamp(24px,5vw,96px);display:flex;flex-wrap:wrap;gap:28px 64px;align-items:flex-end;justify-content:space-between\">\n    <div data-reveal=\"up\" style=\"display:flex;flex-direction:column;gap:22px\">\n      <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Відгуки Google<\u002Fspan>\n      <h2 style=\"margin:0;font:300 clamp(42px,4.4vw,80px)/1 'Cormorant';letter-spacing:-.015em\">Відгуки <em style=\"font-style:italic\">клієнтів<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div data-reveal=\"up\" data-delay=\"120\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:24px 40px\">\n      <span style=\"display:flex;align-items:center;gap:16px\"><span style=\"font:300 52px/1 'Cormorant'\">5.0<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"display:flex;gap:2px;color:#8a6f4e;font-size:12px\"><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><\u002Fspan><span style=\"font:400 10px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;color:#6a6158\">48 відгуків у Google<\u002Fspan><\u002Fspan><\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ prev }}\" aria-label=\"Назад\" style=\"width:56px;height:56px;border:1px solid #29241f;background:transparent;color:#29241f;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:background .4s,color .4s\" style-hover=\"background:#29241f;color:#f3efe9\"><i class=\"ic ic-arrow-left\"><\u002Fi><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ next }}\" aria-label=\"Далі\" style=\"width:56px;height:56px;border:1px solid #29241f;background:transparent;color:#29241f;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:background .4s,color .4s\" style-hover=\"background:#29241f;color:#f3efe9\"><i class=\"ic ic-arrow-right\"><\u002Fi><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div ref=\"{{ trackRef }}\" sc-camel-on-mouse-enter=\"{{ pause }}\" sc-camel-on-mouse-leave=\"{{ resume }}\" data-reveal=\"up\" data-delay=\"200\" style=\"display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 max(clamp(24px,5vw,96px), calc((100vw - 1680px) / 2 + 96px));scroll-padding-left:max(clamp(24px,5vw,96px), calc((100vw - 1680px) / 2 + 96px))\">\n    <sc-for list=\"{{ reviews }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <article style=\"flex:none;width:min(460px,84vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:26px;padding:40px 36px 34px;background:#ebe5dc;min-height:360px\">\n        <span style=\"font:italic 300 72px/.5 'Cormorant';color:#8a6f4e;height:26px\">“<\u002Fspan>\n        <p style=\"margin:0;font:300 24px/1.38 'Cormorant';text-wrap:pretty\">{{ v.text }}<\u002Fp>\n        <div style=\"margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:22px;border-top:1px solid rgba(41,36,31,.16)\">\n          <span style=\"display:flex;flex-direction:column;gap:9px;min-width:0\"><span style=\"font:400 10.5px/1.3 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase\">{{ v.name }}<\u002Fspan><span style=\"font-size:12.5px;font-weight:300;color:#6a6158\">{{ v.tag }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:300;color:#6a6158;white-space:nowrap\">{{ v.date }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"max-width:1680px;margin:40px auto 0;padding:0 clamp(24px,5vw,96px);display:flex;flex-wrap:wrap;gap:20px 36px\">\n    <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:10px;padding-bottom:7px;border-bottom:1px solid #29241f;font:400 10.5px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase\" style-hover=\"color:#8a6f4e;border-color:#8a6f4e\">Усі відгуки в Google <i class=\"ic ic-arrow-up-right\" style=\"font-size:12px\"><\u002Fi><\u002Fa>\n    <a href=\"#\" style=\"padding-bottom:7px;font:400 10.5px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;color:#6a6158\">Залишити відгук<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"09 FAQ\" style=\"background:#ebe5dc;padding:clamp(80px,9vw,150px) clamp(24px,5vw,96px)\">\n  <div style=\"max-width:1488px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px clamp(40px,6vw,120px)\">\n    <div data-reveal=\"up\" style=\"flex:1 1 340px;max-width:500px;display:flex;flex-direction:column;gap:22px\">\n      <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Питання та відповіді<\u002Fspan>\n      <h2 style=\"margin:0;font:300 clamp(42px,4.4vw,80px)/1 'Cormorant';letter-spacing:-.015em\">Часті <em style=\"font-style:italic\">питання<\u002Fem><\u002Fh2>\n      <p style=\"margin:0;font-size:15px;line-height:1.75;font-weight:300;color:#6a6158;max-width:360px\">Не знайшли відповідь? Поставте питання напряму — відповім особисто.<\u002Fp>\n      <button sc-camel-on-click=\"{{ openModal }}\" style=\"align-self:flex-start;margin-top:8px;display:inline-flex;align-items:center;padding:19px 31px;border:1px solid #29241f;background:transparent;color:#29241f;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:background .4s,color .4s\" style-hover=\"background:#29241f;color:#f3efe9\">Поставити питання<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-reveal=\"up\" data-delay=\"120\" style=\"flex:1.6 1 560px;border-bottom:1px solid rgba(41,36,31,.16)\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"border-top:1px solid rgba(41,36,31,.16)\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:32px;padding:30px 0\">\n            <h3 style=\"margin:0;font:400 clamp(22px,1.8vw,28px)/1.25 'Cormorant'\">{{ f.q }}<\u002Fh3>\n            <i class=\"ic ic-plus\" style=\"flex:none;font-size:18px;transform:rotate({{ f.rot }});transition:transform .5s cubic-bezier(.2,.7,.2,1)\"><\u002Fi>\n          <\u002Fbutton>\n          <div style=\"display:grid;grid-template-rows:{{ f.rows }};transition:grid-template-rows .6s cubic-bezier(.2,.7,.2,1)\">\n            <div style=\"min-height:0;overflow:hidden\"><p style=\"margin:0;padding:0 64px 32px 0;font-size:14.5px;line-height:1.8;font-weight:300;color:#4a433c;max-width:760px;text-wrap:pretty\">{{ f.a }}<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10 SEO текст 2\" style=\"max-width:1680px;margin:0 auto;padding:clamp(80px,9vw,140px) clamp(24px,5vw,96px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px clamp(40px,6vw,120px)\">\n    <h2 data-reveal=\"up\" style=\"flex:1 1 380px;margin:0;font:300 clamp(28px,2.6vw,44px)/1.14 'Cormorant';text-wrap:balance\">Як обрати адвоката для своєї справи<\u002Fh2>\n    <article data-reveal=\"up\" data-delay=\"120\" style=\"flex:1.3 1 520px;max-width:820px;display:flex;flex-direction:column;gap:20px\">\n      <p style=\"margin:0;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c;text-wrap:pretty\">Звертайте увагу на три речі: чи має адвокат практику саме у вашій категорії справ, чи веде він справу особисто і чи готовий письмово зафіксувати вартість та обсяг робіт. Індивідуальна практика дає саме це: один відповідальний адвокат, прямий зв'язок і прозорі умови.<\u002Fp>\n      <div style=\"display:grid;grid-template-rows:{{ seo2Rows }};transition:grid-template-rows .7s cubic-bezier(.2,.7,.2,1)\">\n        <div style=\"min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px\">\n          <h3 style=\"margin:6px 0 0;font:400 24px/1.2 'Cormorant'\">Що підготувати до консультації<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c\">Документи, які у вас є, хронологію подій і перелік питань. Якщо документів немає — це не перешкода: їх можна отримати в процесі роботи.<\u002Fp>\n          <h3 style=\"margin:10px 0 0;font:400 24px/1.2 'Cormorant'\">Консультація онлайн<\u002Fh3>\n          <p style=\"margin:0 0 6px;font-size:15px;line-height:1.85;font-weight:300;color:#4a433c\">Консультація доступна в Telegram, Viber, WhatsApp або відеозв'язком. Це зручно, якщо ви в іншому місті чи за кордоном.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleSeo2 }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:0 0 7px;border:none;border-bottom:1px solid #29241f;background:transparent;color:#29241f;font:400 10.5px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;cursor:pointer\" style-hover=\"color:#8a6f4e;border-color:#8a6f4e\">{{ seo2Label }} <i class=\"ic ic-plus\" style=\"font-size:12px;transform:rotate({{ seo2Rot }});transition:transform .4s\"><\u002Fi><\u002Fbutton>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer id=\"contacts\" style=\"background:#29241f;color:#efe9e0;padding:clamp(72px,8vw,130px) clamp(24px,5vw,96px) 28px\">\n  <div style=\"max-width:1680px;margin:0 auto\">\n    <div data-reveal=\"up\" style=\"display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-end;justify-content:space-between;padding-bottom:clamp(48px,6vw,88px);border-bottom:1px solid rgba(239,233,224,.16)\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:400 11px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#b5aa9c\">Зателефонуйте<\u002Fspan>\n        <a href=\"tel:+380000000000\" style=\"font:300 clamp(44px,5.6vw,104px)/1 'Cormorant';letter-spacing:-.01em;color:#efe9e0\" style-hover=\"color:#d4bf9f\">+380 00 000 00 00<\u002Fa>\n er;padding:20px\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"position:relative;width:min(480px,100%);background:#f3efe9;padding:48px 44px 44px;display:flex;flex-direction:column;gap:16px\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Закрити\" style=\"position:absolute;top:16px;right:16px;width:42px;height:42px;border:1px solid rgba(41,36,31,.3);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:16px;color:#29241f\" style-hover=\"background:#29241f;color:#f3efe9\"><i class=\"ic ic-close\"><\u002Fi><\u002Fbutton>\n      <sc-if value=\"{{ cbNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"font:400 10.5px/1.4 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:#6a6158\">Зворотний дзвінок<\u002Fspan>\n        <h3 style=\"margin:0;font:300 40px/1.04 'Cormorant';padding-right:44px\">Замовити <em style=\"font-style:italic\">дзвінок<\u002Fem><\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.7;font-weight:300;color:#6a6158\">Залиште ім'я та номер — я передзвоню найближчим часом.<\u002Fp>\n        <form sc-camel-on-submit=\"{{ submitCb }}\" style=\"display:flex;flex-direction:column;gap:6px;margin-top:6px\">\n          <input required=\"\" placeholder=\"Ваше ім'я\" style=\"height:56px;border:none;border-bottom:1px solid rgba(41,36,31,.3);background:transparent;font:300 22px 'Cormorant';color:#29241f;outline:none\">\n          <input type=\"tel\" required=\"\" placeholder=\"+380 __ ___ __ __\" style=\"height:56px;border:none;border-bottom:1px solid rgba(41,36,31,.3);background:transparent;font:300 22px 'Cormorant';color:#29241f;outline:none\">\n          <button type=\"submit\" style=\"margin-top:26px;height:60px;border:none;background:#29241f;color:#f3efe9;font:400 11px/1 'Tenor Sans';letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .4s\" style-hover=\"background:#4a4038\">Передзвоніть мені<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cbSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font:italic 300 56px/1 'Cormorant'\">Дякую.<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.7;font-weight:300;color:#6a6158\">Скоро передзвоню з номера +380 00 000 00 00.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;},&quot;showSticky&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: 'ua', mega: false, faq: 0, seo1: false, seo2: false, modal: false, formSent: false, cbSent: false, scrolled: false, fab: false };\n  trackRef = React.createRef();\n  paused = false;\n  componentDidMount() {\n    this.onScroll = () => {\n      const y = window.scrollY, sc = y > 30, fab = y > 640;\n      if (sc !== this.state.scrolled || fab !== this.state.fab) this.setState({ scrolled: sc, fab });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n    if ((this.props.animations ?? true) && 'IntersectionObserver' in window) this.setupReveal();\n    this.timer = setInterval(() => { if ((this.props.autoplay ?? true) && !this.paused) this.step(1); }, 5500);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    window.removeEventListener('scroll', this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n  setupReveal() {\n    const ease = 'cubic-bezier(.2,.7,.2,1)';\n    const tgt = el => el.dataset.reveal === 'zoom' ? el.firstElementChild : el;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach(el => {\n      const t = tgt(el); if (!t) return;\n      const d = Number(el.dataset.delay || 0), type = el.dataset.reveal;\n      if (type === 'zoom') { t.style.transform = 'scale(1.08)'; t.style.transition = `transform 2.4s ${ease} ${d}ms`; }\n      else if (type === 'line') { t.style.transformOrigin = 'left'; t.style.transform = 'scaleX(0)'; t.style.transition = `transform 1.6s cubic-bezier(.65,0,.25,1) ${d}ms`; }\n      else { t.style.opacity = '0'; t.style.transform = 'translateY(26px)'; t.style.transition = `opacity 1.2s ease ${d}ms, transform 1.2s ${ease} ${d}ms`; }\n    });\n    this.io = new IntersectionObserver(entries => entries.forEach(e => {\n      if (!e.isIntersecting) return;\n      const t = tgt(e.target);\n      if (t) { t.style.opacity = ''; t.style.transform = ''; }\n      this.io.unobserve(e.target);\n    }), { threshold: 0.1, rootMargin: '0px 0px -5% 0px' });\n    requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(el => this.io.observe(el))));\n  }\n  step(d) {\n    const el = this.trackRef.current; if (!el) return;\n    const card = el.querySelector('article');\n    const w = card ? card.getBoundingClientRect().width + 24 : 484;\n    if (d > 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 8) el.scrollTo({ left: 0, behavior: 'smooth' });\n    else if (d < 0 && el.scrollLeft <= 4) el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });\n    else el.scrollBy({ left: d * w, behavior: 'smooth' });\n  }\n  renderVals() {\n    const s = this.state;\n    const services = [\n      { icon: 'ic-scales', label: 'Кримінальне право', title: 'Корупційні справи', items: ['Захист у провадженнях НАБУ, САП, ДБР', 'Представництво у ВАКС', 'Супровід на допитах'] },\n      { icon: 'ic-coins', label: 'Кримінальне право', title: 'Економічні та фінансові злочини', items: ['Податкові злочини', 'Шахрайство та привласнення', 'Зняття арешту з майна'] },\n      { icon: 'ic-shield-star', label: 'Військове право', title: 'Адвокат по ТЦК та СП', items: ['Оскарження дій ТЦК', 'Оскарження рішень ВЛК', 'Оформлення відстрочки'] },\n      { icon: 'ic-documents', label: 'Адміністративне право', title: 'Адміністративні правопорушення', items: ['Справи за КУпАП', 'Оскарження постанов', 'Представництво в суді'] },\n      { icon: 'ic-truck', label: 'Транспортне право', title: 'Ліцензії на перевезення', items: ['Пасажирські та вантажні перевезення', 'Розширення та зміни ліцензії', 'Супровід перевірок'] },\n      { icon: 'ic-id-card', label: 'Транспортне право', title: 'Чіп-карта водія', items: ['Оформлення картки для тахографа', 'Заміна та відновлення', 'Картки для підприємств'] },\n      { icon: 'ic-steering', label: 'Транспортне право', title: 'Код 95', items: ['Консультація щодо вимог', 'Підготовка документів', 'Супровід отримання'] },\n      { icon: 'ic-globe', label: 'Транспортне право', title: 'Код EORI', items: ['Реєстрація номера EORI', 'Митні процедури в ЄС', 'Супровід перевізників'] }\n    ].map((x, i) => ({ ...x, n: String(i + 1).padStart(2, '0'), delay: (i % 4) * 110 }));\n    const roman = ['I', 'II', 'III', 'IV', 'V', 'VI'];\n    const steps = [\n      'Аналіз ситуації, перспектив справи та можливих ризиків',\n      'Досудове врегулювання: претензії, переговори, запити',\n      'Збір документів і доказів для захисту позиції',\n      'Розробка правової позиції та підготовка процесуальних документів',\n      'Представництво в суді та державних органах',\n      'Оскарження рішень і контроль їх виконання'\n    ].map((text, i) => ({ text, n: roman[i], delay: i * 160 }));\n    const reasons = [\n      { icon: 'ic-user-focus', title: 'Особисто', text: 'Не передаю справи помічникам. Ви говорите з адвокатом, який веде ваш захист.' },\n      { icon: 'ic-target', title: 'Спеціалізація', text: 'Кримінальні, адміністративні та транспортні справи — щоденна практика.' },\n
