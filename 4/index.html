  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

clamp(44px,4.8vw,80px)/1.04 'Spectral';letter-spacing:-.02em;text-wrap:balance;max-width:760px\">Адвокат Мазур — захист прав фізичних осіб і бізнесу<\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(15px,1.1vw,17px);line-height:1.6;color:#3d4549;max-width:460px\">У кримінальних, адміністративних і транспортних справах — особисто, від першої консультації до рішення суду.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <a href=\"#contact\" style=\"padding:15px 22px;background:#111;color:#fff;border-radius:4px;font-size:14px\" style-hover=\"background:#2a2a2a;color:#fff\">Отримати консультацію<\u002Fa>\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"padding:15px 22px;background:#fff;color:#111;border:none;border-radius:4px;font-size:14px;cursor:pointer\" style-hover=\"background:#f3f7f8\">Передзвоніть мені<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 480px;position:relative;min-height:620px\">\n      <div style=\"position:absolute;inset:0\"><image-slot id=\"v4-hero\" src=\"545e4d40-8422-44fa-8fec-2bafd70323c1\" shape=\"rect\" placeholder=\"Фото 1 — портрет адвоката — по пояс, світлий фон або PNG без фону\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"position:absolute;right:0;bottom:56px;width:min(300px,70%);background:#c24c0a;color:#fff;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 50px rgba(0,0,0,.18)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase\">Чому я<\u002Fspan><span style=\"width:26px;height:26px;border-radius:4px;background:#111;display:grid;place-items:center;font-size:14px\"><i class=\"ic ic-user-focus\"><\u002Fi><\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 22px/1.15 'Spectral'\">Особисто<\u002Fspan>\n        <div style=\"height:120px;border-radius:4px;overflow:hidden\"><image-slot id=\"v4-hero-small\" src=\"cdc8a969-6d83-4783-9663-805365eeaba1\" shape=\"rect\" placeholder=\"Фото 4 — адвокат з клієнтом\"><\u002Fimage-slot><\u002Fdiv>\n        <span style=\"font-size:12.5px;line-height:1.45\">Не передаю справи помічникам. Ви говорите з адвокатом, який веде ваш захист.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;left:clamp(20px,4vw,72px);bottom:-56px;z-index:3;width:270px;background:#fff;border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 40px rgba(0,0,0,.15)\">\n    <span style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#5b6266\">Рейтинг у Google<\u002Fspan>\n    <span style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font:400 34px/1 'Spectral'\">5.0<\u002Fspan><span style=\"display:flex;gap:1px;color:#c24c0a;font-size:13px\"><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><\u002Fspan><\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#5b6266\">\n      <span style=\"display:flex\"><span style=\"width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:10px;border:2px solid #fff\">ОК<\u002Fspan><span style=\"width:26px;height:26px;border-radius:50%;background:#c24c0a;color:#fff;display:grid;place-items:center;font-size:10px;border:2px solid #fff;margin-left:-8px\">ІМ<\u002Fspan><span style=\"width:26px;height:26px;border-radius:50%;background:#5b6266;color:#fff;display:grid;place-items:center;font-size:10px;border:2px solid #fff;margin-left:-8px\">АТ<\u002Fspan><\u002Fspan>48 відгуків у Google\n    <\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"about\" data-screen-label=\"02 Про адвоката\" style=\"background:linear-gradient(180deg,#0b0b0b calc(100% - 150px),#dde9ee calc(100% - 15  <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px\">\n      <div style=\"background:#fff;color:#111;border-radius:6px;padding:24px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:20px\">\n        <span style=\"width:38px;height:38px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:20px\"><i class=\"ic ic-user-focus\"><\u002Fi><\u002Fspan>\n        <p style=\"margin:0;font:400 clamp(19px,1.5vw,23px)/1.35 'Spectral';text-wrap:pretty\">Індивідуальна практика без посередників: кожну справу веду особисто і відповідаю за результат — від аналізу документів до виступу в суді.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"min-height:300px;border-radius:6px;overflow:hidden\"><image-slot id=\"v4-about\" src=\"55698238-d7dd-4826-9475-8556cb45d8bc\" shape=\"rect\" placeholder=\"Фото 5 — робота з документами\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"background:#c24c0a;color:#fff;border-radius:6px;padding:24px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:20px\">\n        <span style=\"width:38px;height:38px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:20px\"><i class=\"ic ic-certificate\"><\u002Fi><\u002Fspan>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;font:400 clamp(20px,1.6vw,24px)/1.2 'Spectral'\">\n          <li style=\"padding:12px 0;border-top:1px solid rgba(255,255,255,.4)\">Свідоцтво № 0000<\u002Fli>\n          <li style=\"padding:12px 0;border-top:1px solid rgba(255,255,255,.4)\">Член НААУ<\u002Fli>\n          <li style=\"padding:12px 0;border-top:1px solid rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.4)\">Київ · вся Україна<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<main>\n<section id=\"services\" data-screen-label=\"03 Послуги\" style=\"max-width:1560px;margin:0 auto;padding:clamp(90px,9vw,140px) clamp(32px,4vw,84px) 40px\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px 60px;align-items:flex-end;justify-content:space-between;margin-bottom:56px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#b04509\">Послуги<\u002Fspan>\n      <h2 style=\"margin:0;font:400 clamp(34px,3.4vw,54px)/1.1 'Spectral';letter-spacing:-.015em;max-width:640px;text-wrap:balance\">Надаю послуги<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:380px;font-size:14px;line-height:1.6;color:#3d4549;text-align:right\">Вісім напрямів практики — від кримінального захисту до документів для перевізників.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-bottom:1px solid rgba(17,17,17,.18)\">\n    <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px 40px;padding:34px 0;border-top:1px solid rgba(17,17,17,.18)\">\n        <span style=\"flex:0 1 220px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#3d4549;padding-top:8px\">{{ s.label }}<\u002Fspan>\n        <h3 style=\"flex:1 1 300px;margin:0;font:400 clamp(22px,1.8vw,28px)/1.2 'Spectral'\">{{ s.title }}<\u002Fh3>\n        <ul style=\"flex:1 1 300px;margin:0;padding:6px 0 0;list-style:none;display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ s.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;gap:12px;align-items:center;font-size:14px;color:#2b3236\"><i class=\"ic ic-li-dot\" style=\"font-size:14px;color:#c24c0a\"><\u002Fi>{{ it }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <a href=\"#contact\" aria-label=\"Детальніше\" style=\"flex:none;width:36px;height:36px;border-radius:4px;background:#111;color:#fff;display:grid;place-items:center;font-size:17px\" style-hover=\"background:#c24c0a;color:#fff\"><i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 SEO текст 1\" style=\"max-width:1560px;margin:0 auto;padding:70px clamp(32px,4vw,84px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:28px 60px\">\n    <h2 style=\"flex:1 1 380px;margin:0;font:400 clamp(26px,2.4vw,38px)/1.18 'Spectral';text-wrap:balance\">Адвокат Мазур: юридичний захист у кримінальних, адміністративних і транспортних справах<\u002Fh2>\n    <article style=\"flex:1.3 1 520px;display:flex;flex-direction:column;gap:16px\">\n      <p style=\"margin:0;font-size:15px;line-height:1.8;color:#3d4549;text-wrap:pretty\">Адвокат Мазур надає правову допомогу фізичним особам, підприємцям і перевізникам у справах, де від швидкості та точності дій залежить результат. Кожна справа починається з аналізу документів і обставин: ви отримуєте зрозумілу оцінку ризиків, план дій і фіксовану вартість роботи ще до підписання договору.<\u002Fp>\n      <sc-if value=\"{{ seo1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h3 style=\"margin:8px 0 0;font:400 22px/1.2 'Spectral'\">Кримінальний захист<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.8;color:#3d4549\">Захист у справах про корупційні, економічні та фінансові злочини; супровід на допитах; оскарження запобіжних заходів і арешту майна; представництво у ВАКС та судах усіх інстанцій.<\u002Fp>\n        <h3 style=\"margin:8px 0 0;font:400 22px/1.2 'Spectral'\">Транспортне право<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.8;color:#3d4549\">Отримання ліцензій на перевезення пасажирів і вантажів, оформлення чіп-карти водія, Коду 95 та номера EORI для роботи з митницями ЄС. Супровід перевірок і оскарження штрафів.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleSeo1 }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid #111;border-radius:4px;background:transparent;color:#111;font-size:13px;cursor:pointer\" style-hover=\"background:#111;color:#fff\">{{ seo1Label }} <i class=\"ic ic-chevron-down\" style=\"transform:rotate({{ seo1Rot }});transition:transform .2s\"><\u002Fi><\u002Fbutton>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"steps\" data-screen-label=\"05 Етапи\" style=\"max-width:1560px;margin:0 auto;padding:clamp(70px,8vw,120px) clamp(32px,4vw,84px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px 60px;align-items:flex-end;justify-content:space-between;margin-bottom:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#b04509\">Етапи<\u002Fspan>\n      <h2 style=\"margin:0;font:400 clamp(34px,3.4vw,54px)/1.1 'Spectral';letter-spacing:-.015em\">Як проходить робота<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px\">\n      <a href=\"#contact\" style=\"padding:13px 20px;background:#111;color:#fff;border-radius:4px;font-size:13.5px\" style-hover=\"background:#2a2a2a;color:#fff\">Отримати консультацію<\u002Fa>\n      <a href=\"#contact\" aria-label=\"Консультація\" style=\"width:46px;display:grid;place-items:center;background:#c24c0a;color:#fff;border-radius:4px;font-size:17px\" style-hover=\"background:#a8410a;color:#fff\"><i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px\">\n    <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"6\">\n      <div style=\"background:#fff;border-radius:6px;padding:24px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;gap:28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n          <span style=\"width:38px;height:38px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:20px\"><i class=\"ic {{ st.icon }}\"><\u002Fi><\u002Fspan>\n          <span style=\"font:400 30px/1 'Spectral';color:#c24c0a\">{{ st.n }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font:400 21px/1.3 'Spectral';text-wrap:balance\">{{ st.text }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" data-screen-label=\"06 Чому я\" style=\"max-width:1560px;margin:0 auto;padding:clamp(40px,5vw,80px) clamp(32px,4vw,84px) clamp(70px,8vw,120px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px 60px;align-items:flex-end;justify-content:space-between;margin-bottom:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#b04509\">Чому я<\u002Fspan>\n      <h2 style=\"margin:0;font:400 clamp(34px,3.4vw,54px)/1.1 'Spectral';letter-spacing:-.015em\">Чому клієнти обирають мене<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:380px;font-size:14px;line-height:1.6;color:#3d4549;text-align:right\">Ви працюєте з адвокатом, а не з фірмою — без помічників, стажерів і посередників.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n    <div style=\"flex:1 1 480px;min-height:clamp(520px,44vw,720px);border-radius:6px;overflow:hidden\"><image-slot id=\"v4-big-photo\" src=\"03d46468-2c78-4547-91cf-3906dca654fc\" shape=\"rect\" placeholder=\"Фото 2 — адвокат у кабінеті або в суді — вертикальне\"><\u002Fimage-slot><\u002Fdiv>\n    <div style=\"flex:1.2 1 560px;display:flex;flex-direction:column;gap:6px\">\n    <div style=\"flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px\">\n      <sc-for list=\"{{ reasons }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;border-radius:6px;padding:24px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:24px\">\n          <span style=\"width:38px;height:38px;border-radius:5px;background:#111;color:#fff;display:grid;place-items:center;font-size:20px\"><i class=\"ic {{ r.icon }}\"><\u002Fi><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:400 23px/1.15 'Spectral'\">{{ r.title }}<\u002Fh3><p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6266;text-wrap:pretty\">{{ r.text }}<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px;margin-top:10px\">\n      <a href=\"#contact\" style=\"padding:15px 22px;background:#111;color:#fff;border-radius:4px;font-size:14px\" style-hover=\"background:#2a2a2a;color:#fff\">Записатися на консультацію<\u002Fa>\n      <a href=\"#contact\" aria-label=\"Консультація\" style=\"width:50px;display:grid;place-items:center;background:#c24c0a;color:#fff;border-radius:4px;font-size:17px\" style-hover=\"background:#a8410a;color:#fff\"><i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fa>\n      <button sc-camel-on-click=\"{{ openModal }}\" style=\"margin-left:4px;padding:15px 22px;background:#fff;color:#111;border:none;border-radius:4px;font-size:14px;cursor:pointer\" style-hover=\"background:#f3f7f8\">Передзвоніть мені<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"07 Заявка\" style=\"padding:0 12px\">\n  <div style=\"background:#0b0b0b;color:#fff;border-radius:22px;padding:clamp(20px,3vw,40px)\">\n    <div style=\"max-width:1560px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:stretch;gap:24px clamp(32px,5vw,80px)\">\n      <div style=\"flex:1 1 420px;min-height:520px;border-radius:12px;overflow:hidden\"><image-slot id=\"v4-form-photo\" src=\"25e96957-5e04-485b-8edd-3c82b3c2a747\" shape=\"rect\" placeholder=\"Фото 3 — Феміда / атрибути адвоката\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"flex:1.1 1 480px;padding:clamp(12px,3vw,48px) 0;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n        <span style=\"font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#e86a1f\">Заявка<\u002Fspan>\n        <h2 style=\"margin:0;font:400 clamp(30px,3vw,48px)/1.12 'Spectral';text-wrap:balance\">Хочете отримати консультацію та оцінку перспектив справи?<\u002Fh2>\n        <p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;color:#b8bec1\">Заповніть форму — я зв'яжуся з вами та запропоную план дій.<\u002Fp>\n        <sc-if value=\"{{ formNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px\">\n            <input required=\"\" placeholder=\"Ваше ім'я\" style=\"height:56px;border-radius:4px;border:none;background:#1c1c1c;padding:0 18px;color:#fff;font-size:15px;outline:none\">\n            <input type=\"tel\" required=\"\" placeholder=\"Номер телефону\" style=\"height:56px;border-radius:4px;border:none;background:#1c1c1c;padding:0 18px;color:#fff;font-size:15px;outline:none\">\n            <sc-raw-select style=\"grid-column:1 / -1;height:56px;border-radius:4px;border:none;background:#1c1c1c;padding:0 14px;color:#fff;font-size:15px;outline:none\">\n              <option>Оберіть напрям<\u002Foption>\n              <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\"><option>{{ s.title }}<\u002Foption><\u002Fsc-for>\n              <option>Інше<\u002Foption>\n            <\u002Fsc-raw-select>\n            <div style=\"grid-column:1 / -1;display:flex;gap:4px;margin-top:8px\">\n              <button type=\"submit\" style=\"flex:1;height:56px;border:none;border-radius:4px;background:#fff;color:#111;font-size:14.5px;font-weight:500;cursor:pointer\" style-hover=\"background:#e9eff1\">Надіслати заявку<\u002Fbutton>\n              <button type=\"submit\" aria-label=\"Надіслати\" style=\"width:56px;border:none;border-radius:4px;background:#c24c0a;color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center\" style-hover=\"background:#a8410a\"><i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"grid-column:1 / -1;margin:6px 0 0;font-size:12px;line-height:1.5;color:#8a9397\">Натискаючи кнопку, ви погоджуєтеся на обробку <a href=\"#\" style=\"text-decoration:underline\">персональних даних<\u002Fa>.<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:16px;padding:22px;border-radius:6px;background:#1c1c1c\"><i class=\"ic ic-check-circle\" style=\"font-size:32px;color:#e86a1f\"><\u002Fi><span style=\"font-size:15px;line-height:1.5\"><b style=\"font-weight:500;color:#e86a1f\">Дякую.<\u002Fb> Заявку отримано. Я зв'яжуся з вами найближчим часом.<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"reviews\" data-screen-label=\"08 Відгуки\" style=\"padding:clamp(90px,9vw,140px) 0 clamp(60px,6vw,90px);overflow:hidden\">\n  <div style=\"max-width:1560px;margin:0 auto 48px;padding:0 clamp(32px,4vw,84px);display:flex;flex-wrap:wrap;gap:24px 60px\">\n    <span style=\"flex:0 1 220px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#b04509;padding-top:12px\">Відгуки Google<\u002Fspan>\n    <div style=\"flex:1 1 520px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <h2 style=\"margin:0;font:400 clamp(34px,3.4vw,54px)/1.1 'Spectral';letter-spacing:-.015em\">Відгуки клієнтів<\u002Fh2>\n        <span style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#3d4549\"><span style=\"font:400 20px/1 'Spectral';color:#111\">5.0<\u002Fspan><span style=\"display:flex;gap:1px;color:#c24c0a\"><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><\u002Fspan>48 відгуків у Google<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:4px\">\n        <button sc-camel-on-click=\"{{ prev }}\" aria-label=\"Назад\" style=\"width:46px;height:46px;border-radius:4px;border:none;background:#111;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:18px\" style-hover=\"background:#2a2a2a\"><i class=\"ic ic-arrow-left\"><\u002Fi><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ next }}\" aria-label=\"Далі\" style=\"width:46px;height:46px;border-radius:4px;border:none;background:#c24c0a;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:18px\" style-hover=\"background:#a8410a\"><i class=\"ic ic-arrow-right\"><\u002Fi><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div ref=\"{{ trackRef }}\" sc-camel-on-mouse-enter=\"{{ pause }}\" sc-camel-on-mouse-leave=\"{{ resume }}\" style=\"display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 max(clamp(32px,4vw,84px), calc((100vw - 1560px) / 2 + 84px));scroll-padding-left:max(clamp(32px,4vw,84px), calc((100vw - 1560px) / 2 + 84px))\">\n    <sc-for list=\"{{ reviews }}\" as=\"v\" hint-placeholder-count=\"4\">\n      <article style=\"flex:none;width:min(400px,82vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:20px;padding:26px;background:#fff;border-radius:6px;min-height:280px\">\n        <span style=\"display:flex;gap:1px;color:#c24c0a;font-size:13px\"><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><i class=\"ic ic-star-fill\"><\u002Fi><\u002Fspan>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#2b3236;text-wrap:pretty\">«{{ v.text }}»<\u002Fp>\n        <div style=\"margin-top:auto;display:flex;align-items:center;gap:12px\">\n          <span style=\"width:38px;height:38px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;flex:none\">{{ v.initials }}<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n            <span style=\"font:400 17px/1.2 'Spectral'\">{{ v.name }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#5b6266\">{{ v.tag }} · {{ v.date }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"max-width:1560px;margin:36px auto 0;padding:0 clamp(32px,4vw,84px);display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;font-size:13.5px\">\n    <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:8px;padding:12px 18px;background:#111;color:#fff;border-radius:4px\" style-hover=\"background:#c24c0a;color:#fff\">Усі відгуки в Google <i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fa>\n    <a href=\"#\" style=\"text-decoration:underline;text-underline-offset:4px\">Залишити відгук<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"09 FAQ\" style=\"max-width:1000px;margin:0 auto;padding:clamp(60px,7vw,100px) clamp(32px,4vw,84px)\">\n  <div style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:52px\">\n    <span style=\"font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#b04509\">Питання та відповіді<\u002Fspan>\n    <h2 style=\"margin:0;font:400 clamp(34px,3.4vw,54px)/1.1 'Spectral';letter-spacing:-.015em\">Часті питання<\u002Fh2>\n    <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3d4549;max-width:420px\">Не знайшли відповідь? Поставте питання напряму — відповім особисто.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n      <div style=\"border-bottom:1px solid rgba(17,17,17,.18)\">\n        <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 0\">\n          <h3 style=\"margin:0;font:400 19px/1.35 'Spectral'\">{{ f.q }}<\u002Fh3>\n          <span style=\"flex:none;width:22px;height:22px;border-radius:3px;background:#c24c0a;color:#fff;display:grid;place-items:center;font-size:12px;transform:rotate({{ f.rot }});transition:transform .25s\"><i class=\"ic ic-plus\"><\u002Fi><\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;padding:0 60px 22px 0;font-size:14.5px;line-height:1.7;color:#3d4549;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;margin-top:36px\">\n    <button sc-camel-on-click=\"{{ openModal }}\" style=\"padding:13px 20px;background:#111;color:#fff;border:none;border-radius:4px;font-size:13.5px;cursor:pointer\" style-hover=\"background:#2a2a2a\">Поставити питання<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10 SEO текст 2\" style=\"max-width:1560px;margin:0 auto;padding:40px clamp(32px,4vw,84px) clamp(80px,8vw,120px)\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:28px 60px;padding-top:56px;border-top:1px solid rgba(17,17,17,.18)\">\n    <h2 style=\"flex:1 1 380px;margin:0;font:400 clamp(26px,2.4vw,38px)/1.18 'Spectral';text-wrap:balance\">Як обрати адвоката для своєї справи<\u002Fh2>\n    <article style=\"flex:1.3 1 520px;display:flex;flex-direction:column;gap:16px\">\n      <p style=\"margin:0;font-size:15px;line-height:1.8;color:#3d4549;text-wrap:pretty\">Звертайте увагу на три речі: чи має адвокат практику саме у вашій категорії спра size:14px;cursor:pointer\" style-hover=\"background:#2a2a2a\">Передзвоніть мені<\u002Fbutton>\n            <button type=\"submit\" aria-label=\"Надіслати\" style=\"width:54px;border:none;border-radius:4px;background:#c24c0a;color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center\"><i class=\"ic ic-arrow-up-right\"><\u002Fi><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cbSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <i class=\"ic ic-check-circle\" style=\"font-size:40px;color:#c24c0a\"><\u002Fi>\n        <h3 style=\"margin:0;font:400 30px/1.1 'Spectral'\">Дякую.<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;color:#3d4549;line-height:1.5\">Скоро передзвоню з номера +380 00 000 00 00.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSticky&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: 'ua', mega: false, faq: 0, seo1: false, seo2: false, modal: false, formSent: false, cbSent: false };\n  trackRef = React.createRef();\n  paused = false;\n  componentDidMount() {\n    this.timer = setInterval(() => { if ((this.props.autoplay ?? true) && !this.paused) this.step(1); }, 5000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  step(d) {\n    const el = this.trackRef.current; if (!el) return;\n    const card = el.querySelector('article');\n    const w = card ? card.getBoundingClientRect().width + 6 : 406;\n    if (d > 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 8) el.scrollTo({ left: 0, behavior: 'smooth' });\n    else if (d < 0 && el.scrollLeft <= 4) el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });\n    else el.scrollBy({ left: d * w, behavior: 'smooth' });\n  }\n  renderVals() {\n    const s = this.state;\n    const services = [\n      { icon: 'ic-scales', label: 'Кримінальне право', title: 'Корупційні справи', items: ['Захист у провадженнях НАБУ, САП, ДБР', 'Представництво у ВАКС', 'Супровід на допитах'] },\n      { icon: 'ic-coins', label: 'Кримінальне право', title: 'Економічні та фінансові злочини', items: ['Податкові злочини', 'Шахрайство та привласнення', 'Зняття арешту з майна'] },\n      { icon: 'ic-shield-star', label: 'Військове право', title: 'Адвокат по ТЦК та СП', items: ['Оскарження дій ТЦК', 'Оскарження рішень ВЛК', 'Оформлення відстрочки'] },\n      { icon: 'ic-documents', label: 'Адміністративне право', title: 'Адміністративні правопорушення', items: ['Справи за КУпАП', 'Оскарження постанов', 'Представництво в суді'] },\n      { icon: 'ic-truck', label: 'Транспортне право', title: 'Ліцензії на перевезення', items: ['Пасажирські та вантажні перевезення', 'Розширення та зміни ліцензії', 'Супровід перевірок'] },\n      { icon: 'ic-id-card', label: 'Транспортне право', title: 'Чіп-карта водія', items: ['Оформлення картки для тахографа', 'Заміна та відновлення', 'Картки для підприємств'] },\n      { icon: 'ic-steering', label: 'Транспортне право', title: 'Код 95', items: ['Консультація щодо вимог', 'Підготовка документів', 'Супровід отримання'] },\n      { icon: 'ic-globe', label: 'Транспортне право', title: 'Код EORI', items: ['Реєстрація номера EORI', 'Митні процедури в ЄС', 'Супровід перевізників'] }\n    ];\n    const steps = [\n      { icon: 'ic-search', text: 'Аналіз ситуації, перспектив справи та можливих ризиків' },\n      { icon: 'ic-consult', text: 'Досудове врегулювання: претензії, переговори, запити' },\n      { icon: 'ic-folder', text: 'Збір документів і доказів для захисту позиції' },\n      { icon: 'ic-quill', text: 'Розробка правової позиції та підготовка процесуальних документів' },\n      { icon: 'ic-court', text: 'Представництво в суді та державних органах' },\n      { icon: 'ic-appeal', text: 'Оскарження рішень і контроль їх виконання' }\n    ].map((x, i) => ({ ...x, n: String(i + 1).padStart(2, '0') }));\n    const reasons = [\n      { icon: 'ic-user-focus', title: 'Особисто', text: 'Не передаю справи помічникам. Ви говорите з адвокатом, який веде ваш захист.' },\n      { icon: 'ic-target', title: 'Спеціалізація', text: 'Кримінальні, адміністративні та транспортні справи — щоденна практика.' },\n      { icon: 'ic-eye', title: 'Чесно', text: 'Реальна оцінка перспектив ще до підписання договору.' },\n      { icon: 'ic-receipt', title: 'Прозора ціна', text: 'Вартість і етапи фіксуються в договорі. Без доплат.' },\n      { icon: 'ic-chat', title: 'На зв’язку', text: 'Прямий номер адвоката, месенджери, консультації онлайн.' },\n      { icon: 'ic-lock', title: 'Таємниця', text: 'Усе, що ви розповідаєте, захищено адвокатською таємницею.' }\n    ];\n    const reviews = [\n      { name: 'Олександр К.', initials: 'ОК', tag: 'Кримінальна справа', date: '2 тижні тому', text: 'Адвокат одразу пояснив, що робити далі, і був поруч на кожному етапі. Результатом задоволений.' },\n      { name: 'Ірина М.', initials: 'ІМ', tag: 'ТЦК та СП', date: '1 місяць тому', text: 'Допоміг оскаржити рішення ВЛК. Усе пояснював простими словами і завжди був на зв’язку.' },\n      { name: 'Андрій, ТОВ «Транслайн»', initials: 'АТ', tag: 'Ліцензія на перевезення', date: '1 місяць тому', text: 'Оформили ліцензію на вантажні перевезення без жодної відмови. Окремо дякую за підготовку до перевірки.' },\n      { name: 'Віталій Р.', initials: 'ВР', tag: 'Код 95', date: '2 місяці тому', text: 'Швидко зорієнтував щодо Коду 95 і чіп-карти. Зекономив мені тиждень біганини по інстанціях.' },\n      { name: 'Наталія С.', initials: 'НС', tag: 'Економічні злочини', date: '3 місяці тому', text: 'Складна справа щодо податків. Адвокат Мазур знайшов процесуальні порушення, і провадження закрили.' },\n      { name: 'Дмитро П.', initials: 'ДП', tag: 'Адмінправопорушення', date: '4 місяці тому', text: 'Постанову скасували в суді. Професійно, швидко і без зайвих слів. Рекомендую.' }\n    ];\n    const faqData = [\n      { q: 'Скільки коштує консультація адвоката?', a: 'Вартість залежить від категорії справи та обсягу документів. Точну ціну я називаю до початку роботи і фіксую її в договорі.' },\n      { q: 'Чи можна отримати консультацію онлайн?', a: 'Так. Консультую в Telegram, Viber, WhatsApp або відеозв’язком. Документи можна надіслати фото чи скан-копією.' },\n      { q: 'З якими справами ви працюєте?', a: 'Корупційні, економічні та фінансові злочини, спори з ТЦК та СП, адміністративні правопорушення, а також транспортне право: ліцензії на перевезення, чіп-карта водія, Код 95 і код EORI.' },\n      { q: 'Ви працюєте з підприємствами чи лише з фізичними особами?', a: 'З обома. Перевізникам і компаніям допомагаю з ліцензуванням, перевірками та захистом посадових осіб; фізичним особам — у кримінальних, військових та адміністративних справах.' },\n      { q: 'Хто буде вести мою справу?', a: 'Я особисто. Це індивідуальна адвокатська практика: справи не передаються помічникам чи іншим юристам.' },\n      { q: 'Чи гарантуєте ви результат?', a: 'Жоден чесний адвокат не гарантує рішення суду. Я гарантую професійний захист, прозорість кожного кроку і чесну оцінку перспектив.' }\n    ];\n    const faqs = faqData.map((f, i) => ({ ...f, open: s.faq === i, rot: s.faq === i ? '45deg' : '0deg', toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i })) }));\n    const ua = s.lang === 'ua';\n    return {\n      services, steps, reasons, reviews, faqs,\n      mega: s.mega,\n      openMega: () => this.setState({ mega: true }),\n      closeMega: () => this.setState({ mega: false }),\n      toggleMega: () => this.setState(st => ({ mega: !st.mega })),\n      uaColor: ua ? '#c24c0a' : '#6b7377', enColor: ua ? '#6b7377' : '#c24c0a',\n      setUA: () => this.setState({ lang: 'ua' }), setEN: () => this.setState({ lang: 'en' }),\n      seo1: s.seo1, seo1Label: s.seo1 ? 'Згорнути' : 'Читати повністю', seo1Rot: s.seo1 ? '180deg' : '0deg',\n      toggleSeo1: () => this.setState(st => ({ seo1: !st.seo1 })),\n      seo2: s.seo2, seo2Label: s.seo2 ? 'Згорнути' : 'Читати повністю', seo2Rot: s.seo2 ? '180deg' : '0deg',\n      toggleSeo2: () => this.setState(st => ({ seo2: !st.seo2 })),\n      modal: s.modal,\n      openModal: () => this.setState({ modal: true, cbSent: false }),\n      closeModal: () => this.setState({ modal: false }),\n      stop: e => e.stopPropagation(),\n      cbSent: s.cbSent, cbNotSent: !s.cbSent,\n      submitCb: e => { e.preventDefault(); this.setState({ cbSent: true }); },\n      formSent: s.formSent, formNotSent: !s.formSent,\n      submitForm: e => { e.preventDefault(); this.setState({ formSent: true }); },\n      trackRef: this.trackRef,\n      prev: () => this.step(-1), next: () => this.step(1),\n      pause: () => { this.paused = true; }, resume: () => { this.paused = false; },\n      showSticky: this.props.showSticky ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
