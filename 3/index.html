  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-wrap:wrap;gap:14px 0;font-size:14px;letter-spacing:.03em\">\n        <div style=\"display:flex;align-items:center;white-space:nowrap\">\n        <button sc-camel-on-mouse-enter=\"{{ openMega }}\" sc-camel-on-click=\"{{ toggleMega }}\" style=\"all:unset;cursor:pointer;padding:4px 16px;display:flex;align-items:center;gap:6px\">Послуги <i class=\"ic ic-chevron-down\" style=\"font-size:12px\"><\u002Fi><\u002Fbutton>\n        <a href=\"#about\" style=\"padding:4px 16px;border-left:1px solid rgba(255,255,255,.2);color:#e2b85e;text-decoration:underline;text-underline-offset:6px\">Про мене<\u002Fa>\n        <a href=\"#steps\" style=\"padding:4px 16px;border-left:1px solid rgba(255,255,255,.2)\">Етапи<\u002Fa>\n        <a href=\"#reviews\" style=\"padding:4px 16px;border-left:1px solid rgba(255,255,255,.2)\">Відгуки<\u002Fa>\n        <a href=\"#contacts\" style=\"padding:4px 16px;border-left:1px solid rgba(255,255,255,.2)\">Контакти<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto;display:flex;align-items:center;white-space:nowrap\">\n        <span style=\"padding:4px 16px;border-left:1px solid rgba(255,255,255,.2);display:flex;gap:6px;font-size:13px\">\n          <button sc-camel-on-click=\"{{ setUA }}\" style=\"all:unset;cursor:pointer;color:{{ uaColor }}\">UA<\u002Fbutton><span style=\"opacity:.35\">/<\u002Fspan><button sc-camel-on-click=\"{{ setEN }}\" style=\"all:unset;cursor:pointer;color:{{ enColor }}\">EN<\u002Fbutton>\n        <\u002Fspan>\n        <a href=\"tel:+380000000000\" style=\"padding:12px 16px;border-radius:12px;border:1px solid rgba(226,184,94,.45);display:flex;align-items:center;gap:8px;font-size:14px\"><i class=\"ic ic-gold ic-phone\" style=\"color:#e2b85e;font-size:17px\"><\u002Fi>+380 00 000 00 00<\u002Fa>\n        <a href=\"#contact\" style=\"margin-left:8px;padding:13px 16px;border-radius:12px;background:linear-gradient(180deg,#f8e2a6 0%,#e7bf68 45%,#f4d68c 100%);color:#2a2112;font-weight:700;font-size:13px;letter-spacing:.06em;box-shadow:0 3px 0 #9c7a3a\" style-hover=\"color:#2a2112;filter:brightness(1.06)\">Консультація<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fnav>\n    <sc-if value=\"{{ mega }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:0;right:0;top:calc(100% - 8px);background:#1a1917;border:1px solid rgba(226,184,94,.25);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <a href=\"#services\" sc-camel-on-click=\"{{ closeMega }}\" style=\"display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;font-size:14.5px\" style-hover=\"background:rgba(226,184,94,.08);color:#f0cf7f\">\n            <i class=\"ic ic-gold {{ s.icon }}\" style=\"font-size:24px;color:#e2b85e;flex:none\"><\u002Fi>{{ s.title }}\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1560px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:stretch;gap:20px 48px\">\n    <div style=\"flex:1.1 1 520px;display:flex;flex-direction:column;justify-content:center;gap:32px;padding:50px 0 150px\">\n      <span style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e2b85e\">Індивідуальна адвокатська практика<\u002Fspan>\n      <h1 style=\"margin:0;font:400 clamp(46px,5vw,86px)/1.02 'Oranienbaum';text-transform:uppercase;letter-spacing:.01em;text-wrap:balance\">Адвокат Мазур — <span style=\"background:linear-gradient(180deg,#f8e2a6 0%,#e2b85e 55%,#b9883a 100%);-webkit-background-clip:text;background-clip:text;color:transparent\">захист прав<\u002Fspan> фізичних осіб і бізнесу<\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(16px,1.25vw,20px);line-height:1.55;color:#cfc9bf;max-width:520px;letter-spacing:.02em\">У кримінальних, адміністративних і транспортних справах — особисто, від першої консультації до рішення суду.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n        <a href=\"#contact\" style=\"padding:22px 42px;border-radius:16px;background:linear-gradient(180deg,#f8e2a6 0%,#e7bf68 45%,#f4d68c 100%);color:#2a2112;font-weight:700;font-size:15px;letter-spacing:.08em;box-shadow:0 5px 0 #9c7a3a, 0 18px 40px rgba(226,184,94,.28)\" style-hover=\"color:#2a2112;filter:brightness(1.06)\">Отримати консультацію<\u002Fa>\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"display:flex;align-items:center;gap:10px;padding:20px 26px;border-radius:16px;border:1px solid rgba(226,184,94,.45);background:transparent;color:#f2efe9;font-size:14.5px;letter-spacing:.06em;cursor:pointer\" style-hover=\"border-color:#e2b85e;color:#f0cf7f\"><i class=\"ic ic-gold ic-phone\" style=\"font-size:18px;color:#e2b85e\"><\u002Fi>Передзвоніть мені<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:560px;padding-top:22px;border-top:1px solid rgba(226,184,94,.25);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a9a39a\">\n        <span>Свідоцтво № 0000<\u002Fspan><i class=\"ic ic-li-diamond ic-gold\" style=\"font-size:11px\"><\u002Fi><span>Член НААУ<\u002Fspan><i class=\"ic ic-li-diamond ic-gold\" style=\"font-size:11px\"><\u002Fi><span>Київ · вся Україна<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 480px;min-height:640px;position:relative\">\n      <div style=\"position:absolute;inset:0\">\n        <image-slot id=\"v3-hero\" src=\"457e8eea-33b8-431f-af4a-2886656fd3d9\" shape=\"rect\" placeholder=\"Фото 1 — портрет адвоката — по пояс, без фону (PNG), від 1600 px у висоту\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div data-screen-label=\"02a Про адвоката — цифри\" style=\"position:relative;z-index:3;margin:-100px auto 0;max-width:1400px;padding:0 clamp(20px,4vw,72px)\">\n  <div style=\"padding:8px;border-radius:22px;background:#24221f;border-top:3px solid #d9ae5b;box-shadow:0 30px 60px rgba(0,0,0,.55)\">\n    <div style=\"border:1px dashed rgba(255,255,255,.18);border-radius:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))\">\n      <div style=\"padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:clamp(42px,4vw,62px);font-weight:300;line-height:1\">12<span style=\"color:#e2b85e\">+<\u002Fspan> <span style=\"font-size:22px\">років<\u002Fspan><\u002Fspan><span style=\"font-size:15px;color:#cfc9bf;letter-spacing:.03em\">адвокатської практики<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;border-left:1px solid rgba(255,255,255,.08)\"><span style=\"font-size:clamp(42px,4vw,62px);font-weight:300;line-height:1\">500<span style=\"color:#e2b85e\">+<\u002Fspan><\u002Fspan><span style=\"font-size:15px;color:#cfc9bf;letter-spacing:.03em\">справ і проваджень<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;border-left:1px solid rgba(255,255,255,.08)\"><span style=\"font-size:clamp(42px,4vw,62px);font-weight:300;line-height:1\">8<\u002Fspan><span style=\"font-size:15px;color:#cfc9bf;letter-spacing:.03em\">напрямів практики<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;border-left:1px solid rgba(255,255,255,.08)\"><span style=\"font-size:clamp(42px,4vw,62px);font-weight:300;line-height:1\">5.0<\u002Fspan><span style=\"font-size:15px;color:#cfc9bf;letter-spacing:.03em\">рейтинг у Google<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main>\n<section id=\"about\" data-screen-label=\"02b Про адвоката\" style=\"padding:clamp(90px,9vw,140px) clamp(20px,4vw,72px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px\">\n    <span style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e2b85e\">Про адвоката<\u002Fspan>\n    <h2 style=\"margin:0;font:400 clamp(34px,3.6vw,58px)/1.08 'Oranienbaum';text-transform:uppercase;text-wrap:balance\">Я захищаю людей і бізнес там, де помилка коштує <span style=\"background:linear-gradient(180deg,#f8e2a6 0%,#e2b85e 55%,#b9883a 100%);-webkit-background-clip:text;background-clip:text;color:transparent\">свободи, ліцензії або репутації<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.7;color:#bdb6ab;max-width:640px;letter-spacing:.02em\">Індивідуальна практика без посередників: кожну справу веду особисто і відповідаю за результат — від аналізу документів до виступу в суді.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" data-screen-label=\"03 Послуги\" style=\"padding:clamp(100px,10vw,160px) clamp(20px,4vw,72px) 60px\">\n  <div style=\"position:relative;text-align:center;margin-bottom:70px\">\n    <span aria-hidden=\"true\" style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font:400 clamp(100px,14vw,240px)/1 'Oranienbaum';text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);pointer-events:none\">Послуги<\u002Fspan>\n    <h2 style=\"position:relative;margin:0;font:400 clamp(42px,5vw,76px)/1 'Oranienbaum';text-transform:uppercase;background:linear-gradient(180deg,#f8e2a6 0%,#e2b85e 55%,#b9883a 100%);-webkit-background-clip:text;background-clip:text;color:transparent\">Надаю послуги<\u002Fh2>\n    <p style=\"position:relative;margin:22px auto 0;max-width:520px;font-size:15px;line-height:1.6;color:#bdb6ab;letter-spacing:.02em\">Вісім напрямів практики — від кримінального захисту до документів для перевізників.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px\">\n    <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <article style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:36px 28px 30px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#1f1e1b,#151412);transition:border-color .25s, transform .25s\" style-hover=\"border-color:rgba(226,184,94,.55);transform:translateY(-3px)\">\n        <span style=\"padding:7px;border-radius:22px;background:#121110;box-shadow:0 8px 24px rgba(0,0,0,.5)\"><span style=\"width:78px;height:78px;border-radius:16px;background:linear-gradient(180deg,#3a3834,#262521);border:1px solid rgba(255,255,255,.06);display:grid;place-items:center\"><i class=\"ic ic-gold {{ s.icon }}\" style=\"font-size:40px;color:#e2b85e\"><\u002Fi><\u002Fspan><\u002Fspan>\n        <span style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a9a39a;margin-bottom:-6px\">{{ s.label }}<\u002Fspan>\n        <h3 style=\"margin:0;font:400 26px/1.08 'Oranienbaum';text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;min-height:58px;display:flex;align-items:center\">{{ s.title }}<\u002Fh3>\n        <i class=\"ic ic-li-diamond ic-gold\" style=\"font-size:16px\"><\u002Fi>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;text-align:left;align-self:stretch\">\n          <sc-for list=\"{{ s.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;gap:10px;font-size:14px;line-height:1.45;color:#d6d0c6\"><i class=\"ic ic-li-diamond ic-gold\" style=\"font-size:12px;margin-top:4px\"><\u002Fi>{{ it }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <a href=\"#contact\" style=\"margin-top:auto;padding:14px 28px;border-radius:12px;border:1px solid rgba(226,184,94,.5);font-size:13px;letter-spacing:.08em;color:#f0cf7f\" style-hover=\"background:rgba(226,184,94,.1);color:#f8e2a6\">Детальніше<\u002Fa>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 SEO текст 1\" style=\"padding:70px clamp(20px,4vw,72px)\">\n  <div style=\"max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px 80px;padding-top:56px;border-top:1px solid rgba(226,184,94,.2)\">\n    <h2 style=\"flex:1 1 380px;margin:0;font:400 clamp(28px,2.8vw,42px)/1.1 'Oranienbaum';text-transform:uppercase;text-wrap:balance\">Адвокат Мазур: юридичний захист у кримінальних, адміністративних і транспортних справах<\u002Fh2>\n    <article style=\"flex:1.4 1 520px;display:flex;flex-direction:column;gap:18px\">\n      <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab;text-wrap:pretty\">Адвокат Мазур надає правову допомогу фізичним особам, підприємцям і перевізникам у справах, де від швидкості та точності дій залежить результат. Кожна справа починається з аналізу документів і обставин: ви отримуєте зрозумілу оцінку ризиків, план дій і фіксовану вартість роботи ще до підписання договору.<\u002Fp>\n      <sc-if value=\"{{ seo1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h3 style=\"margin:8px 0 0;font:400 24px/1.2 'Oranienbaum';color:#f0cf7f\">Кримінальний захист<\u002Fh3>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab\">Захист у справах про корупційні, економічні та фінансові злочини; супровід на допитах; оскарження запобіжних заходів і арешту майна; представництво у ВАКС та судах усіх інстанцій.<\u002Fp>\n        <h3 style=\"margin:8px 0 0;font:400 24px/1.2 'Oranienbaum';color:#f0cf7f\">Транспортне право<\u002Fh3>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab\">Отримання ліцензій на перевезення пасажирів і вантажів, оформлення чіп-карти водія, Коду 95 та номера EORI для роботи з митницями ЄС. Супровід перевірок і оскарження штрафів.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleSeo1 }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;border:1px solid rgba(226,184,94,.45);background:transparent;color:#f0cf7f;font-size:13px;letter-spacing:.06em;cursor:pointer\" style-hover=\"background:rgba(226,184,94,.08)\">{{ seo1Label }} <i class=\"ic ic-gold ic-chevron-down\" style=\"transform:rotate({{ seo1Rot }});transition:transform .2s\"><\u002Fi><\u002Fbutton>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"steps\" data-screen-label=\"05 Етапи\" style=\"position:relative;padding:clamp(80px,9vw,140px) clamp(20px,4vw,72px)\">\n  <div style=\"position:relative;text-align:center;margin-bottom:80px\">\n    <span aria-hidden=\"true\" style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font:400 clamp(100px,14vw,240px)/1 'Oranienbaum';text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);pointer-events:none\">Етапи<\u002Fspan>\n    <h2 style=\"position:relative;margin:0;font:400 clamp(42px,5vw,76px)/1 'Oranienbaum';text-transform:uppercase;background:linear-gradient(180deg,#ffffff 0%,#d8d2c8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(226,184,94,.25)\">Як проходить робота<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"position:relative;max-width:1400px;margin:0 auto\">\n    <div style=\"position:relative;overflow:hidden;padding-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(calc((100% - 120px) / 6), calc((1100px - 100%) * 999), calc((100% - 48px) / 3)),1fr));gap:56px 24px\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"6\">\n        <div style=\"position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px\">\n          <sc-if value=\"{{ st.line }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"position:absolute;top:64px;left:50%;right:calc(-50% - 24px);border-top shadow:0 5px 0 #9c7a3a, 0 18px 40px rgba(226,184,94,.22)\" style-hover=\"color:#2a2112;filter:brightness(1.06)\">Записатися на консультацію<\u002Fa>\n        <button sc-camel-on-click=\"{{ openModal }}\" style=\"display:flex;align-items:center;gap:10px;padding:18px 24px;border-radius:16px;border:1px solid rgba(226,184,94,.45);background:transparent;color:#f2efe9;font-size:14px;letter-spacing:.06em;cursor:pointer\" style-hover=\"border-color:#e2b85e;color:#f0cf7f\"><i class=\"ic ic-gold ic-phone\" style=\"font-size:18px;color:#e2b85e\"><\u002Fi>Передзвоніть мені<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"07 Заявка\" style=\"padding:clamp(60px,7vw,110px) clamp(20px,4vw,72px)\">\n  <div style=\"max-width:1400px;margin:0 auto;position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(700px 500px at 20% 50%, rgba(201,160,82,.14), rgba(0,0,0,0) 70%), #141311;border:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;align-items:stretch\">\n    <div style=\"flex:1 1 420px;min-height:520px;position:relative\">\n      <div style=\"position:absolute;inset:0\"><image-slot id=\"v3-themis\" src=\"e0476723-d4d8-4fe9-a8ea-ef26a00c8aaa\" shape=\"rect\" placeholder=\"Фото 3 — Феміда / атрибути адвоката (PNG без фону)\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1.1 1 480px;padding:clamp(32px,4.5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:16px\">\n      <span style=\"font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#e2b85e\">Заявка<\u002Fspan>\n      <h2 style=\"margin:0;font:400 clamp(30px,3vw,46px)/1.12 'Oranienbaum';text-transform:uppercase;text-wrap:balance\">Хочете отримати консультацію та оцінку перспектив справи?<\u002Fh2>\n      <p style=\"margin:0 0 10px;font-size:15px;line-height:1.6;color:#bdb6ab;letter-spacing:.02em\">Заповніть форму — я зв'яжуся з вами та запропоную план дій.<\u002Fp>\n 0px 24px 26px;font-size:15px;line-height:1.7;color:#bdb6ab;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"10 SEO текст 2\" style=\"padding:40px clamp(20px,4vw,72px) clamp(70px,8vw,120px)\">\n  <div style=\"max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px 80px;padding-top:56px;border-top:1px solid rgba(226,184,94,.2)\">\n    <h2 style=\"flex:1 1 380px;margin:0;font:400 clamp(28px,2.8vw,42px)/1.1 'Oranienbaum';text-transform:uppercase;text-wrap:balance\">Як обрати адвоката для своєї справи<\u002Fh2>\n    <article style=\"flex:1.4 1 520px;display:flex;flex-direction:column;gap:18px\">\n      <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab;text-wrap:pretty\">Звертайте увагу на три речі: чи має адвокат практику саме у вашій категорії справ, чи веде він справу особисто і чи готовий письмово зафіксувати вартість та обсяг робіт. Індивідуальна практика дає саме це: один відповідальний адвокат, прямий зв'язок і прозорі умови.<\u002Fp>\n      <sc-if value=\"{{ seo2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h3 style=\"margin:8px 0 0;font:400 24px/1.2 'Oranienbaum';color:#f0cf7f\">Що підготувати до консультації<\u002Fh3>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab\">Документи, які у вас є, хронологію подій і перелік питань. Якщо документів немає — це не перешкода: їх можна отримати в процесі роботи.<\u002Fp>\n        <h3 style=\"margin:8px 0 0;font:400 24px/1.2 'Oranienbaum';color:#f0cf7f\">Консультація онлайн<\u002Fh3>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.8;color:#bdb6ab\">Консультація доступна в Telegram, Viber, WhatsApp або відеозв'язком. Це зручно, якщо ви в іншому місті чи за кордоном.<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleSeo2 }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:8 place-items:center;color:#e2b85e;font-size:19px\"><i class=\"ic ic-gold ic-instagram\"><\u002Fi><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1.2 1 240px;display:flex;flex-direction:column;gap:11px;font-size:14px\">\n      <span style=\"font:400 20px/1 'Oranienbaum';text-transform:uppercase;color:#e2b85e;margin-bottom:8px\">Послуги<\u002Fspan>\n      <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"8\"><a href=\"#services\" style=\"color:#bdb6ab\">{{ s.title }}<\u002Fa><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:12px;font-size:14px\">\n      <span style=\"font:400 20px/1 'Oranienbaum';text-transform:uppercase;color:#e2b85e;margin-bottom:8px\">Контакти<\u002Fspan>\n      <a href=\"tel:+380000000000\" style=\"font-size:22px\">+380 00 000 00 00<\u002Fa>\n      <a href=\"mailto:info@advokatmazur.com.ua\" style=\"color:#bdb6ab\">info@advokatmazur.com.ua<\u002Fa>\n      <span style=\"color:#bdb6ab\">м. Київ, вул. Адреса офісу, 00<\u002Fspan>\n      <span style=\"color:#bdb6ab\">Пн–Пт 9:00–19:00<\u002Fspan>\n      <button sc-camel-on-click=\"{{ openModal }}\" style=\"align-self:flex-start;margin-top:8px;padding:16px 26px;border:none;border-radius:12px;background:linear-gradient(180deg,#f8e2a6 0%,#e7bf68 45%,#f4d68c 100%);color:#2a2112;font-weight:700;font-size:13.5px;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #9c7a3a\" style-hover=\"filter:brightness(1.06)\">Замовити дзвінок<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:60px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;font-size:12.5px;color:#6f6a62\">\n    <span>© 2026 Адвокат Мазур<\u002Fspan>\n    <div style=\"display:flex;gap:22px\"><a href=\"#\">Політика конфіденційності<\u002Fa><span>UA / EN<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showSticky }}\" \">\n          <input required=\"\" placeholder=\"Ваше ім'я\" style=\"height:58px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);padding:0 18px;font-size:15px;color:#f2efe9;outline:none\">\n          <input type=\"tel\" required=\"\" placeholder=\"Номер телефону\" style=\"height:58px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);padding:0 18px;font-size:15px;color:#f2efe9;outline:none\">\n          <button type=\"submit\" style=\"height:60px;border:none;border-radius:12px;background:linear-gradient(180deg,#f8e2a6 0%,#e7bf68 45%,#f4d68c 100%);color:#2a2112;font-weight:700;font-size:14.5px;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #9c7a3a\">Передзвоніть мені<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cbSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <i class=\"ic ic-gold ic-check-circle\" style=\"font-size:44px;color:#e2b85e\"><\u002Fi>\n        <h3 style=\"margin:0;font:400 34px/1.05 'Oranienbaum';text-transform:uppercase\">Дякую.<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;color:#bdb6ab;line-height:1.5\">Скоро передзвоню з номера +380 00 000 00 00.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSticky&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведінка&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: 'ua', mega: false, faq: 0, seo1: false, seo2: false, modal: false, formSent: false, cbSent: false };\n  trackRef = React.createRef();\n  paused = false;\n  componentDidMount() {\n    this.timer = setInterval(() => { if ((this.props.autoplay ?? true) && !this.paused) this.step(1); }, 5000);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  step(d) {\n    const el = this.trackRef.current; if (!el) return;\n    const card = el.querySelector('article');\n    const w = card ? card.getBoundingClientRect().width + 20 : 440;\n    if (d > 0 && el.scrollLeft + el.clientWidth >= el.scrollWidth - 8) el.scrollTo({ left: 0, behavior: 'smooth' });\n    else if (d < 0 && el.scrollLeft <= 4) el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });\n    else el.scrollBy({ left: d * w, behavior: 'smooth' });\n  }\n  renderVals() {\n    const s = this.state;\n    const services = [\n      { icon: 'ic-scales', label: 'Кримінальне право', title: 'Корупційні справи', items: ['Захист у провадженнях НАБУ, САП, ДБР', 'Представництво у ВАКС', 'Супровід на допитах'] },\n      { icon: 'ic-coins', label: 'Кримінальне право', title: 'Економічні та фінансові злочини', items: ['Податкові злочини', 'Шахрайство та привласнення', 'Зняття арешту з майна'] },\n      { icon: 'ic-shield-star', label: 'Військове право', title: 'Адвокат по ТЦК та СП', items: ['Оскарження дій ТЦК', 'Оскарження рішень ВЛК', 'Оформлення відстрочки'] },\n      { icon: 'ic-documents', label: 'Адміністративне право', title: 'Адміністративні правопорушення', items: ['Справи за КУпАП', 'Оскарження постанов', 'Представництво в суді'] },\n      { icon: 'ic-truck', label: 'Транспортне право', title: 'Ліцензії на перевезення', items: ['Пасажирські та вантажні перевезення', 'Розширення та зміни ліцензії', 'Супровід перевірок'] },\n      { icon: 'ic-id-card', label: 'Транспортне право', title: 'Чіп-карта водія', items: ['Оформлення картки для тахографа', 'Заміна та відновлення', 'Картки для підприємств'] },\n      { icon: 'ic-steering', label: 'Транспортне право', title: 'Код 95', items: ['Консультація щодо вимог', 'Підготовка документів', 'Супровід отримання'] },\n      { icon: 'ic-globe', label: 'Транспортне право', title: 'Код EORI', items: ['Реєстрація номера EORI', 'Митні процедури в ЄС', 'Супровід перевізників'] }\n    ];\n    const steps = [\n      { icon: 'ic-search', text: 'Аналіз ситуації, перспектив справи та можливих ризиків' },\n      { icon: 'ic-consult', text: 'Досудове врегулювання: претензії, переговори, запити' },\n      { icon: 'ic-folder', text: 'Збір документів і доказів для захисту позиції' },\n      { icon: 'ic-quill', text: 'Розробка правової позиції та підготовка процесуальних документів' },\n      { icon: 'ic-court', text: 'Представництво в суді та державних органах' },\n      { icon: 'ic-appeal', text: 'Оскарження рішень і контроль їх виконання' }\n    ].map((x, i) => ({ ...x, n: String(i + 1).padStart(2, '0'), line: i < 5 }));\n    const reasons = [\n      { icon: 'ic-user-focus', title: 'Особисто', text: 'Не передаю справи помічникам. Ви говорите з адвокатом, який веде ваш захист.' },\n      { icon: 'ic-target', title: 'Спеціалізація', text: 'Кримінальні, адміністративні та транспортні справи — щоденна практика.' },\n      { icon: 'ic-eye', title: 'Чесно', text: 'Реальна оцінка перспектив ще до підписання договору.' },\n      { icon: 'ic-receipt', title: 'Прозора ціна', text: 'Вартість і етапи фіксуються в договорі. Без доплат.' },\n      { icon: 'ic-chat', title: 'На зв’язку', text: 'Прямий номер адвоката, месенджери, консультації онлайн.' },\n      { icon: 'ic-lock', title: 'Таємниця', text: 'Усе, що ви розповідаєте, захищено адвокатською таємницею.' }\n    ];\n    const reviews = [\n      { name: 'Олександр К.', initials: 'ОК', tag: 'Кримінальна справа', date: '2 тижні тому', text: 'Адвокат одразу пояснив, що робити далі, і був поруч на кожному етапі. Результатом задоволений.' },\n      { name: 'Ірина М.', initials: 'ІМ', tag: 'ТЦК та СП', date: '1 місяць тому', text: 'Допоміг оскаржити рішення ВЛК. Усе пояснював простими словами і завжди був на зв’язку.' },\n      { name: 'Андрій, ТОВ «Транслайн»', initials: 'АТ', tag: 'Ліцензія на перевезення', date: '1 місяць тому', text: 'Оформили ліцензію на вантажні перевезення без жодної відмови. Окремо дякую за підготовку до перевірки.' },\n      { name: 'Віталій Р.', initials: 'ВР', tag: 'Код 95', date: '2 місяці тому', text: 'Швидко зорієнтував щодо Коду 95 і чіп-карти. Зекономив мені тиждень біганини по інстанціях.' },\n      { name: 'Наталія С.', initials: 'НС', tag: 'Економічні злочини', date: '3 місяці тому', text: 'Складна справа щодо податків. Адвокат Мазур знайшов процесуальні порушення, і провадження закрили.' },\n      { name: 'Дмитро П.', initials: 'ДП', tag: 'Адмінправопорушення', date: '4 місяці тому', text: 'Постанову скасували в суді. Професійно, швидко і без зайвих слів. Рекомендую.' }\n    ];\n    const faqData = [\n      { q: 'Скільки коштує консультація адвоката?', a: 'Вартість залежить від категорії справи та обсягу документів. Точну ціну я називаю до початку роботи і фіксую її в договорі.' },\n      { q: 'Чи можна отримати консультацію онлайн?', a: 'Так. Консультую в Telegram, Viber, WhatsApp або відеозв’язком. Документи можна надіслати фото чи скан-копією.' },\n      { q: 'З якими справами ви працюєте?', a: 'Корупційні, економічні та фінансові злочини, спори з ТЦК та СП, адміністративні правопорушення, а також транспортне право: ліцензії на перевезення, чіп-карта водія, Код 95 і код EORI.' },\n      { q: 'Ви працюєте з підприємствами чи лише з фізичними особами?', a: 'З обома. Перевізникам і компаніям допомагаю з ліцензуванням, перевірками та захистом посадових осіб; фізичним особам — у кримінальних, військових та адміністративних справах.' },\n      { q: 'Хто буде вести мою справу?', a: 'Я особисто. Це індивідуальна адвокатська практика: справи не передаються помічникам чи іншим юристам.' },\n      { q: 'Чи гарантуєте ви результат?', a: 'Жоден чесний адвокат не гарантує рішення суду. Я гарантую професійний захист, прозорість кожного кроку і чесну оцінку перспектив.' }\n    ];\n    const faqs = faqData.map((f, i) => ({ ...f, open: s.faq === i, rot: s.faq === i ? '45deg' : '0deg', toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i })) }));\n    const ua = s.lang === 'ua';\n    return {\n      services, steps, reasons, reviews, faqs,\n      mega: s.mega,\n      openMega: () => this.setState({ mega: true }),\n      closeMega: () => this.setState({ mega: false }),\n      toggleMega: () => this.setState(st => ({ mega: !st.mega })),\n      uaColor: ua ? '#e2b85e' : '#8d877e', enColor: ua ? '#8d877e' : '#e2b85e',\n      setUA: () => this.setState({ lang: 'ua' }), setEN: () => this.setState({ lang: 'en' }),\n      seo1: s.seo1, seo1Label: s.seo1 ? 'Згорнути' : 'Читати повністю', seo1Rot: s.seo1 ? '180deg' : '0deg',\n      toggleSeo1: () => this.setState(st => ({ seo1: !st.seo1 })),\n      seo2: s.seo2, seo2Label: s.seo2 ? 'Згорнути' : 'Читати повністю', seo2Rot: s.seo2 ? '180deg' : '0deg',\n      toggleSeo2: () => this.setState(st => ({ seo2: !st.seo2 })),\n      modal: s.modal,\n      openModal: () => this.setState({ modal: true, cbSent: false }),\n      closeModal: () => this.setState({ modal: false }),\n      stop: e => e.stopPropagation(),\n      cbSent: s.cbSent, cbNotSent: !s.cbSent,\n      submitCb: e => { e.preventDefault(); this.setState({ cbSent: true }); },\n      formSent: s.formSent, formNotSent: !s.formSent,\n      submitForm: e => { e.preventDefault(); this.setState({ formSent: true }); },\n      trackRef: this.trackRef,\n      prev: () => this.step(-1), next: () => this.step(1),\n      pause: () => { this.paused = true; }, resume: () => { this.paused = false; },\n      showSticky: this.props.showSticky ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
